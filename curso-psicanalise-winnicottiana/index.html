    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Course", "@id": "https://www.larissaponce.com.br/curso-psicanalise-winnicottiana/#curso", "name": "Imersão Winnicottiana: Criando-Encontrando a Teoria e a Clínica", "description": "Curso online de mais de 12 horas sobre a obra de D. W. Winnicott em três frentes: Teoria do Amadurecimento Emocional; pressupostos da técnica, do diagnóstico e da nosografia; e manejo clínico em encontros imersivos com casos ilustrativos. Aulas gravadas, acesso por 8 meses e certificado.", "url": "https://www.larissaponce.com.br/curso-psicanalise-winnicottiana/", "inLanguage": "pt-BR", "educationalCredentialAwarded": "Certificado de conclusão", "provider": {"@id": "https://www.larissaponce.com.br/#larissa"}, "hasCourseInstance": {"@type": "CourseInstance", "courseMode": "online", "courseWorkload": "PT12H", "instructor": {"@id": "https://www.larissaponce.com.br/#larissa"}}, "offers": {"@type": "Offer", "url": "https://go.hotmart.com/D99991354V?dp=1", "price": "1080.00", "priceCurrency": "BRL", "category": "Paid", "availability": "https://schema.org/InStock"}}, {"@type": "Person", "@id": "https://www.larissaponce.com.br/#larissa", "name": "Larissa Garcia Ponce", "jobTitle": "Psicóloga e psicanalista winnicottiana", "alumniOf": ["Pontifícia Universidade Católica de São Paulo (PUC-SP)", "Universidade Estadual Paulista (UNESP)"], "url": "https://www.larissaponce.com.br/", "sameAs": ["http://lattes.cnpq.br/5551249897929580", "https://www.instagram.com/larissaponcepsi", "https://www.youtube.com/@larissagarciaponce"]}, {"@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "O que é a Imersão Winnicottiana?", "acceptedAnswer": {"@type": "Answer", "text": "É um curso online de aprofundamento teórico-clínico na obra de D. W. Winnicott, conduzido por Larissa Garcia Ponce, que articula três frentes de estudo: a Teoria do Amadurecimento Emocional, os pressupostos winnicottianos da técnica, do diagnóstico e da nosografia e o manejo clínico, trabalhado em três encontros imersivos com casos ilustrativos e exercícios de construção de intervenções interpretativas."}}, {"@type": "Question", "name": "O curso trata apenas da Teoria do Amadurecimento Emocional?", "acceptedAnswer": {"@type": "Answer", "text": "A Teoria do Amadurecimento ocupa as quatro primeiras aulas porque oferece o fundamento a partir do qual o diagnóstico e a técnica são pensados em Winnicott. O percurso segue para a quinta aula, dedicada aos pressupostos da técnica, do diagnóstico e do tratamento, e para os encontros imersivos, nos quais o manejo clínico é examinado a partir de casos e da formulação de hipóteses diagnósticas."}}, {"@type": "Question", "name": "Como o diagnóstico é pensado na perspectiva winnicottiana?", "acceptedAnswer": {"@type": "Answer", "text": "Como a doença é compreendida como interrupção do amadurecimento, o diagnóstico procura localizar em que momento, na dependência absoluta, na dependência relativa ou rumo à independência, ocorreu a falha ambiental que paralisou o processo, e de que modo o indivíduo se organizou defensivamente diante dela. Avaliam-se o tipo e a rigidez das defesas, a modalidade de relação com o objeto (objeto subjetivo ou uso do objeto), a integração psicossomática e a preservação do teste de realidade sob intensidade emocional, de modo que os sintomas, tomados isoladamente, não bastam para definir a natureza do sofrimento. Essa leitura permite situar o paciente como integrado, recém-integrado ou não-integrado (Fulgencio, 2016) e orienta a escolha entre análise padrão e análise modificada."}}, {"@type": "Question", "name": "Qual é a diferença entre análise padrão e análise modificada?", "acceptedAnswer": {"@type": "Answer", "text": "A análise padrão destina-se aos pacientes integrados, que alcançaram a condição de pessoa inteira e cujo sofrimento se organiza em torno da ambivalência entre amor e ódio no cenário edípico; nela predominam a interpretação do inconsciente reprimido e a análise da neurose de transferência, com o analista mantido como parte da realidade compartilhada. A análise modificada destina-se aos pacientes recém-integrados e não-integrados, nos quais a falha ambiental ocorreu antes que a integração se estabelecesse. Nesses casos, o centro do trabalho desloca-se para o holding, o handling e a apresentação de objetos, e a regressão à dependência, sustentada por um setting confiável e por um analista que sobrevive sem retaliar, permite que o amadurecimento interrompido seja retomado (Winnicott, 1955)."}}, {"@type": "Question", "name": "Quais quadros clínicos são estudados?", "acceptedAnswer": {"@type": "Answer", "text": "Além das neuroses, dos estados-limite e das psicoses, situados segundo a linha do amadurecimento, o curso aborda os quadros sintomatológicos especiais: a depressão, a persecutoriedade, a tendência antissocial e a psicopatia, os quadros psicossomáticos e as adicções e as organizações de falso self. Para cada quadro, discutem-se a falha ambiental que o origina e o manejo que dela decorre, como a distinção entre a tendência antissocial, ligada à deprivação e portadora de esperança, e a psicopatia, na qual essa esperança se perdeu."}}, {"@type": "Question", "name": "Como a interpretação é trabalhada no curso?", "acceptedAnswer": {"@type": "Answer", "text": "Na perspectiva winnicottiana, interpretar consiste em verbalizar algo que o paciente comunicou e devolvê-lo de forma que ele possa reconhecê-lo como próprio, como algo que criou-encontrou a partir de seu gesto espontâneo. Por isso a interpretação depende da confiabilidade estabelecida, precisa ser compatível com o estágio de amadurecimento em que o paciente se encontra e tende a ser breve e oferecida como possibilidade. Nos encontros imersivos são examinadas as modalidades diferenciadas de intervenção, como o espelhamento, a não interpretação e a tradução de significado na tendência antissocial, além das formas de comunicação e de não comunicação descritas por Winnicott (1963)."}}, {"@type": "Question", "name": "O curso serve para quem está começando na clínica?", "acceptedAnswer": {"@type": "Answer", "text": "Sim. A sequência das aulas parte dos fundamentos da Teoria do Amadurecimento e chega ao manejo, o que permite a quem está iniciando a prática clínica, ou a orientação winnicottiana, organizar o pensamento clínico desde a base. Quem já conhece a obra encontra na articulação entre teoria, diagnóstico e técnica um apoio para a leitura de pacientes de difícil acesso e de quadros graves."}}, {"@type": "Question", "name": "Quantas horas tem o curso e como as aulas são oferecidas?", "acceptedAnswer": {"@type": "Answer", "text": "São mais de 12 horas de conteúdo gravado, entre mais de 8 horas de aulas teóricas e 6 horas distribuídas em três encontros imersivos de 2 horas. Todas as aulas, inclusive os encontros imersivos, ficam disponíveis na plataforma Hotmart por 8 meses a partir da compra."}}, {"@type": "Question", "name": "O curso oferece certificado?", "acceptedAnswer": {"@type": "Answer", "text": "Sim, o curso oferece certificado."}}, {"@type": "Question", "name": "Quanto custa a Imersão Winnicottiana?", "acceptedAnswer": {"@type": "Answer", "text": "R$ 1.080,00 à vista ou em até 12 parcelas de R$ 111,70 na Hotmart."}}, {"@type": "Question", "name": "Quem conduz o curso?", "acceptedAnswer": {"@type": "Answer", "text": "Larissa Garcia Ponce, psicóloga (CRP 08/24725) formada pela UNESP, mestre e doutora em Psicologia Clínica pela PUC-SP e psicanalista winnicottiana filiada ao IBPW e à IWA. Tem mais de 15 anos de prática clínica, há mais de uma década atua como docente e supervisora clínica e leciona na pós-graduação da EPPM e da PUC-PR."}}, {"@type": "Question", "name": "A Imersão é uma formação em psicanálise?", "acceptedAnswer": {"@type": "Answer", "text": "Não. Trata-se de um curso de aprofundamento teórico-clínico, que pode acompanhar a formação psicanalítica, a análise pessoal e a supervisão clínica, sem substituí-las."}}]}]}</script>
